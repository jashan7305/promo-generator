services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: promo-generator

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - promo-storage:/app/backend/storage
      - promo-models:/app/backend/models

    environment:
      PROMO_VISION_API_KEY: ${PROMO_VISION_API_KEY:-}
      PROMO_VISION_MODEL: ${PROMO_VISION_MODEL:-gpt-4.1-mini}
      PROMO_API_TRANSCRIBE_MODEL: ${PROMO_API_TRANSCRIBE_MODEL:-whisper-1}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    restart: unless-stopped

volumes:
  promo-storage:
  promo-models:
